<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>League HUD Overlay</title>
<!--
  Browser source for OBS / vMix: 1920x1080, transparent background.
  Positions, sizes and fonts come straight from design/lol-hud-SCC27.psd.

  URL options (add to the end, e.g. /overlay?timers=0&dragons=1):
    timers=0   hide all objective timers in the top-left (pick which ones in the control panel)
    diff=0     hide the gold-lead tab that slides out under the leading team's gold
    dragons=1  show each team's dragons in the lower strip
    idle=0     hide the whole HUD while no game is running
-->
<style>
  @font-face { font-family: "Heathergreen"; src: url("fonts/Heathergreen.otf") format("opentype"); }
  @font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  svg { display: block; }
  #hud { transition: opacity .4s ease; }
  #hud.hidden { opacity: 0; }
  text { fill: #fff; text-anchor: middle; }
  .inter { font-family: "Inter", sans-serif; font-weight: 700; }
  .hg { font-family: "Heathergreen", "Inter", sans-serif; }
  .start { text-anchor: start; }
  .end { text-anchor: end; }
  .big { font-size: 40px; }
  .tri { font-size: 55.5px; }
  .timer { font-size: 18.9px; }
  .grub { font-size: 20.6px; }
  /* Gold lead: a team-coloured tab that slides down out of the bar. */
  .diff-tab { transform: translateY(-19px); transition: transform .3s cubic-bezier(.5,0,.75,0); }
  .diff-tab.show { transform: translateY(0); transition: transform .5s cubic-bezier(.2,.9,.25,1.15); }
  .diff-tab rect { transition: x .3s ease, width .3s ease; }
  .diff-tab text { font-family: "Inter", sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: .02em; }
  .diff-tab .shine { opacity: 0; }
  .diff-tab.show .shine { animation: shine .9s .35s ease-out; }
  @keyframes shine { 0% { opacity: .9; transform: translateX(-40px); } 100% { opacity: 0; transform: translateX(40px); } }
  /* Series pips: dark when not yet won, bright team colour when won. */
  .pip { fill: rgba(0,0,0,.62); stroke: rgba(255,255,255,.22); stroke-width: 1; }
  .pip.won { stroke: rgba(255,255,255,.85); }
  /* Objective timers, top left (as in the reference broadcast). */
  #timers .box { fill: rgba(0,0,0,.82); }
  #timers text { font-family: "Inter", sans-serif; font-weight: 700; font-size: 17px; text-anchor: start; }
  #timers .letter { font-size: 12px; text-anchor: middle; }
  #timers .live { fill: #ffd34d; }
  /* Boxes fade out when an objective is gone (or switched off) and the rest close up. */
  .obj { transition: transform .4s ease, opacity .3s ease; }
  .obj.off { opacity: 0; }
  .drake { stroke: rgba(0,0,0,.6); stroke-width: 1; }
</style>
</head>
<body>
<svg id="hud" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Team colours. Set from the control panel; see applyColors(). -->
    <filter id="tint-left" color-interpolation-filters="sRGB">
      <feFlood id="flood-left" flood-color="#0a6d4c"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="tint-right" color-interpolation-filters="sRGB">
      <feFlood id="flood-right" flood-color="#bd1313"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <!-- The bar's contour lines, blending from the left team's colour to the right's. -->
    <mask id="lines-mask" maskUnits="userSpaceOnUse" x="511" y="1" width="902" height="105">
      <image href="assets/hud_lines.png" x="511" y="1" width="902" height="105"/></mask>
    <linearGradient id="lines-grad" gradientUnits="userSpaceOnUse" x1="511" y1="0" x2="1413" y2="0">
      <stop id="lines-l1" offset="0"/><stop id="lines-l2" offset=".3"/>
      <stop id="lines-r1" offset=".7"/><stop id="lines-r2" offset="1"/></linearGradient>
  </defs>
  <image href="assets/hud_base.png" x="511" y="1" width="902" height="105"/>
  <rect x="511" y="1" width="902" height="105" fill="url(#lines-grad)" mask="url(#lines-mask)"/>
  <image href="assets/team_left.png" x="511" y="1" width="196" height="70" filter="url(#tint-left)"/>
  <image href="assets/team_right.png" x="1216" y="1" width="197" height="70" filter="url(#tint-right)"/>

  <g id="logo-left-wrap"><image id="logo-left" x="534" y="14" width="40" height="46" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="logo-right-wrap"><image id="logo-right" x="1346" y="14" width="40" height="46" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="pips-left"></g>
  <g id="pips-right"></g>

  <text id="tri-left" class="hg tri" data-max="96" x="610.7" y="57.55"></text>
  <text id="tri-right" class="hg tri" data-max="96" x="1308.6" y="56.94"></text>
  <text id="turrets-left" class="inter big start" x="729" y="53.53">0</text>
  <text id="turrets-right" class="inter big end" x="1193" y="54.02">0</text>
  <text id="gold-left" class="hg big" data-max="62" x="833.1" y="52.03">0.0K</text>
  <text id="gold-right" class="hg big" data-max="62" x="1087.3" y="51.96">0.0K</text>
  <text id="kills-left" class="inter big end" x="938" y="53.07">0</text>
  <text id="kills-right" class="inter big start" x="982" y="53.07">0</text>
  <text id="timer" class="inter timer" x="960" y="93.65">00:00</text>
  <text id="grubs-left" class="inter grub start" x="737" y="94.28">0</text>
  <text id="grubs-right" class="inter grub end" x="1183" y="94.11">0</text>

  <!-- Dragon and Rift Herald counters, same badge style as the grubs icon
       baked into the bar (17px white shield with a cut-out symbol). -->
  <defs>
    <path id="badge" d="M8.5 1 L16 4.2 L14.6 12.8 L8.5 16.5 L2.4 12.8 L1 4.2 Z"
          fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    <mask id="dragon-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="17" height="17">
      <use href="#badge"/>
      <!-- wings spread, head up: a wyvern -->
      <path d="M8.5 3.6 L9.6 6.6 L14 5.2 L11.6 9 L9.4 9.6 L8.5 13.4 L7.6 9.6 L5.4 9 L3 5.2 L7.4 6.6 Z" fill="#000"/>
    </mask>
    <mask id="herald-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="17" height="17">
      <use href="#badge"/>
      <!-- the Herald's eye -->
      <path d="M3.2 8.8 Q8.5 3.4 13.8 8.8 Q8.5 14.2 3.2 8.8 Z" fill="#000"/>
      <circle cx="8.5" cy="8.8" r="1.9" fill="#fff"/>
    </mask>
    <g id="icon-dragon"><rect width="17" height="17" fill="#fff" mask="url(#dragon-cut)"/></g>
    <g id="icon-herald"><rect width="17" height="17" fill="#fff" mask="url(#herald-cut)"/></g>
  </defs>
  <use href="#icon-dragon" x="568" y="78"/>
  <text id="dragons-left" class="inter grub start" x="593" y="94.28">0</text>
  <use href="#icon-herald" x="640" y="78"/>
  <text id="heralds-left" class="inter grub start" x="665" y="94.28">0</text>
  <use href="#icon-herald" x="1263" y="78"/>
  <text id="heralds-right" class="inter grub end" x="1255" y="94.11">0</text>
  <use href="#icon-dragon" x="1335" y="78"/>
  <text id="dragons-right" class="inter grub end" x="1327" y="94.11">0</text>
  <defs>
    <clipPath id="diff-clip"><rect x="511" y="71" width="902" height="35"/></clipPath>
    <linearGradient id="tab-left" x1="0" y1="0" x2="0" y2="1">
      <stop id="tab-left-top" offset="0"/><stop id="tab-left-bottom" offset="1"/></linearGradient>
    <linearGradient id="tab-right" x1="0" y1="0" x2="0" y2="1">
      <stop id="tab-right-top" offset="0"/><stop id="tab-right-bottom" offset="1"/></linearGradient>
    <linearGradient id="tab-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- Clipped at the bar's lower edge so the tabs appear to slide out from under it. -->
  <g clip-path="url(#diff-clip)">
    <g id="diff-left" class="diff-tab" data-cx="833.1">
      <rect y="66" height="22" rx="4" fill="url(#tab-left)"/>
      <rect class="shine" y="71" height="17" width="24" fill="url(#tab-shine)"/>
      <text x="833.1" y="84"></text>
    </g>
    <g id="diff-right" class="diff-tab" data-cx="1087.3">
      <rect y="66" height="22" rx="4" fill="url(#tab-right)"/>
      <rect class="shine" y="71" height="17" width="24" fill="url(#tab-shine)"/>
      <text x="1087.3" y="84"></text>
    </g>
  </g>
  <g id="drakes-left"></g>
  <g id="drakes-right"></g>

  <!-- Objective timers, built by drawObjectives(). -->
  <g id="timers" transform="translate(4,4)"></g>
</svg>
<script>
const params = new URLSearchParams(location.search);
const opt = (k, d) => params.has(k) ? params.get(k) !== "0" : d;
const SHOW = { timers: opt("timers", true), diff: opt("diff", true), dragons: opt("dragons", false), idle: opt("idle", true) };
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const DRAKE_COLORS = { Infernal: "#ff6a2b", Ocean: "#3fb8ff", Mountain: "#b9874f", Cloud: "#c7e4f2",
                       Hextech: "#5fe0e8", Chemtech: "#7fd447" };
// Pip positions from the PSD ("bo3 1 left", "bo3 2 left", ...).
const PIPS = { left: { x: 516, w: 7, y: [12, 40], h: [25, 26] }, right: { x: 1397, w: 8, y: [11, 39], h: [26, 26] } };

$("timers").style.display = SHOW.timers ? "" : "none";

function setText(id, value) {
  const el = $(id);
  value = String(value ?? "");
  if (el.textContent === value) return;
  el.textContent = value;
  fit(el);
}

// Mix a #rrggbb colour with white (amount 0..1).
function lighten(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const ch = shift => Math.round(((n >> shift) & 255) + (255 - ((n >> shift) & 255)) * amount);
  return "#" + [16, 8, 0].map(sh => ch(sh).toString(16).padStart(2, "0")).join("");
}

let colorKey = "";
function applyColors(left, right) {
  if (colorKey === left + right) return;
  colorKey = left + right;
  const stop = (id, c) => $(id).setAttribute("stop-color", c);
  for (const [side, c] of [["left", left], ["right", right]]) {
    $(`flood-${side}`).setAttribute("flood-color", c);
    stop(`tab-${side}-top`, lighten(c, .3));
    stop(`tab-${side}-bottom`, c);
  }
  // Lines are lightened so dark team colours still show on the black bar.
  stop("lines-l1", lighten(left, .35)); stop("lines-l2", lighten(left, .35));
  stop("lines-r1", lighten(right, .35)); stop("lines-r2", lighten(right, .35));
  for (const g of [$("pips-left"), $("pips-right")]) g.dataset.key = "";  // redraw in new colour
}

// Numbers grow away from their icons (anchored on the edge of the PSD's
// one-digit box); text with a data-max width is squeezed if it gets too wide.
function fit(el) {
  if (!el.dataset.max) return;
  el.removeAttribute("textLength");
  if (el.getComputedTextLength() > Number(el.dataset.max)) {
    el.setAttribute("lengthAdjust", "spacingAndGlyphs");
    el.setAttribute("textLength", el.dataset.max);
  }
}
document.fonts.ready.then(() => document.querySelectorAll("text[data-max]").forEach(fit));

// Slide the lead tab in when this side leads, out when it doesn't. While
// sliding out it keeps its last value, so the number doesn't vanish early.
function setDiff(side, value) {
  const tab = $("diff-" + side), text = tab.querySelector("text");
  if (value) {
    if (text.textContent !== value) {
      text.textContent = value;
      const w = Math.ceil(text.getComputedTextLength()) + 16, cx = Number(tab.dataset.cx);
      const bg = tab.querySelector("rect"), first = !bg.style.width;
      if (first) bg.style.transition = "none";  // size the first one instantly
      bg.style.x = cx - w / 2 + "px";
      bg.style.width = w + "px";
      tab.querySelector(".shine").style.x = cx - 12 + "px";
      if (first) { bg.getBBox(); bg.style.transition = ""; }
    }
    tab.classList.add("show");
  } else {
    tab.classList.remove("show");
  }
}

function drawPips(side, bestOf, wins, color) {
  const g = $("pips-" + side), p = PIPS[side], needed = Math.floor(bestOf / 2) + 1;
  const key = bestOf + ":" + wins;
  if (g.dataset.key === key) return;
  g.dataset.key = key;
  g.replaceChildren();
  if (bestOf <= 1) return;
  // The PSD has room for two pips; longer series share the same height.
  const top = p.y[0], bottom = p.y[1] + p.h[1], gap = 3;
  const h = (bottom - top - gap * (needed - 1)) / needed;
  for (let i = 0; i < needed; i++) {
    const pip = document.createElementNS(SVGNS, "rect");
    pip.setAttribute("class", i < wins ? "pip won" : "pip");
    if (i < wins) pip.style.fill = lighten(color, .55);
    pip.setAttribute("x", p.x + .5); pip.setAttribute("width", p.w - 1);
    pip.setAttribute("y", (needed === 2 ? p.y[i] : top + i * (h + gap)) + .5);
    pip.setAttribute("height", (needed === 2 ? p.h[i] : h) - 1);
    pip.setAttribute("rx", 1.5);
    g.appendChild(pip);
  }
}

function drawDrakes(side, list) {
  const g = $("drakes-" + side), key = list.join(",");
  if (!SHOW.dragons || g.dataset.key === key) return;
  g.dataset.key = key;
  g.replaceChildren();
  // Left team's dragons run right-to-left from the timer; right team's left-to-right.
  list.forEach((name, i) => {
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("class", "drake");
    c.setAttribute("cx", side === "left" ? 908 - i * 13 : 1012 + i * 13);
    c.setAttribute("cy", 88); c.setAttribute("r", 6);
    c.setAttribute("fill", DRAKE_COLORS[name] || "#ccc");
    g.appendChild(c);
  });
}

// Objective timer boxes, left to right. A box shows while its objective has a
// countdown or is LIVE; it hides when the objective is gone for the game (or
// for elder, not up yet) or switched off in the control panel.
const OBJECTIVES = [
  { key: "grubs", field: "NEXT GRUBS", letter: "G", color: "#8e44d6" },
  { key: "dragon", field: "NEXT DRAGON", letter: "D", color: "#2aa7a0" },
  { key: "herald", field: "NEXT HERALD", letter: "H", color: "#c2449e" },
  { key: "elder", field: "NEXT ELDER", letter: "E", color: "#d9b65c", dark: true },
  { key: "baron", field: "NEXT BARON", letter: "B", color: "#6c4bd1" },
];
const BOX_W = 96, BOX_GAP = 4;

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}

for (const o of OBJECTIVES) {
  const g = el("g", { id: `obj-${o.key}`, class: "obj off" }, $("timers"));
  el("rect", { class: "box", width: BOX_W, height: 28, rx: 2 }, g);
  el("circle", { cx: 14, cy: 14, r: 9, fill: o.color }, g);
  el("text", { class: "letter", x: 14, y: 18.5, style: o.dark ? "fill:#1a1a1a" : "" }, g).textContent = o.letter;
  el("text", { id: `next-${o.key}`, x: 28, y: 20.5 }, g);
}

function drawObjectives(f, enabled) {
  let x = 0;
  for (const o of OBJECTIVES) {
    const g = $(`obj-${o.key}`), value = f[o.field] || "";
    const visible = enabled[o.key] !== false && value !== "";
    if (value) setText(`next-${o.key}`, value);  // keep the last value while fading out
    $(`next-${o.key}`).classList.toggle("live", value === "LIVE");
    g.classList.toggle("off", !visible);
    if (visible) {
      g.style.transform = `translateX(${x}px)`;
      x += BOX_W + BOX_GAP;
    }
  }
}

// Logo size/position tweak from the control panel, scaled about the centre
// of the PSD's logo box.
const LOGO_CENTER = { left: [554, 37], right: [1366, 37] };
function placeLogo(side, adj) {
  const { scale = 1, x = 0, y = 0 } = adj || {}, [cx, cy] = LOGO_CENTER[side];
  const t = `translate(${cx + x} ${cy + y}) scale(${scale}) translate(${-cx} ${-cy})`;
  const wrap = $(`logo-${side}-wrap`);
  if (wrap.getAttribute("transform") !== t) wrap.setAttribute("transform", t);
}

// Smooth the clock between polls, but stop if the game is paused.
let clock = { base: 0, at: 0, running: false };

function render(s) {
  const f = s.fields, cfg = s.config;
  $("hud").classList.toggle("hidden", !SHOW.idle && !s.detail.connected);
  applyColors(cfg.left.color, cfg.right.color);
  for (const side of ["left", "right"]) {
    const S = side.toUpperCase();
    setText(`tri-${side}`, String(f[`TRI-CODE ${S}`]).toUpperCase());
    setText(`turrets-${side}`, f[`TURRETS ${S}`]);
    setText(`gold-${side}`, f[`GOLD ${S}`]);
    setText(`kills-${side}`, f[`KILLS ${S}`]);
    setText(`grubs-${side}`, f[`VOID GRUB ${S}`]);
    setText(`dragons-${side}`, f[`DRAGONS ${S}`]);
    setText(`heralds-${side}`, f[`HERALDS ${S}`]);
    setDiff(side, SHOW.diff ? f[`GOLD DIFF ${S}`] : "");
    const logo = cfg[side].logo;
    if ($(`logo-${side}`).getAttribute("href") !== logo) $(`logo-${side}`).setAttribute("href", logo);
    placeLogo(side, (cfg.logo_adjust || {})[logo]);
    drawPips(side, cfg.best_of, cfg[side].wins, cfg[side].color);
    drawDrakes(side, s.detail.dragons[side] || []);
  }
  drawObjectives(f, cfg.objective_timers || {});
  // The game reports its clock about once a second; only restart the
  // extrapolation when it moves, so a paused game freezes the timer.
  const t = s.detail.game_time;
  if (t !== clock.base) clock = { base: t, at: performance.now(), running: s.detail.connected && t > clock.base };
}

function tick() {
  let t = clock.base;
  if (clock.running) t += Math.min(1, (performance.now() - clock.at) / 1000);
  t = Math.floor(t);
  setText("timer", String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"));
  requestAnimationFrame(tick);
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    render(await r.json());
  } catch (e) { /* app restarting; keep the last frame on screen */ }
  setTimeout(poll, 500);
}
poll();
tick();
</script>
</body>
</html>
