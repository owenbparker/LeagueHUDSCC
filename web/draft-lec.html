<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft (LEC)</title>
<!-- Champ select overlay (OBS / vMix browser source, 1920x1080) in the look
     of the LEC broadcast: a bar along the bottom with bans and coaches on
     top, a timer line, ten tall pick cards and the match in the middle.
     Driven by the app's /api/draft, like the Europe look. -->
<style>
  @font-face { font-family: "Saira Condensed"; src: url("draft/saira-condensed.woff2") format("woff2"); font-weight: 100 900; }
  @property --blue { syntax: "<color>"; inherits: true; initial-value: #0a6d4c; }
  @property --red { syntax: "<color>"; inherits: true; initial-value: #bd1313; }
  :root {
    --blue: #0a6d4c; --red: #bd1313; --navy: #070b24; --line: rgba(255,255,255,.08);
    --short: "Heathergreen"; --short-weight: 400; --short-style: normal;
    --kill: "Inter"; --kill-weight: 700; --kill-style: normal;
    --card-w: 160px; --mid-w: 320px; --picks-h: 306px; --top-h: 96px;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  .short { font-family: var(--short), "Saira Condensed", sans-serif; font-weight: var(--short-weight); font-style: var(--short-style); }
  .kill { font-family: var(--kill), "Saira Condensed", sans-serif; font-weight: var(--kill-weight); font-style: var(--kill-style);
          font-variant-numeric: tabular-nums; }

  #draft { position: absolute; left: 0; bottom: 0; width: 1920px; height: calc(var(--top-h) + 4px + var(--picks-h));
           color: #fff; transition: --blue 1s ease, --red 1s ease; }
  /* In and out: up from below the screen, back down when champ select ends. */
  #draft { transform: translateY(105%); transition: transform .9s cubic-bezier(.55, 0, .75, .3), --blue 1s, --red 1s; }
  #draft.On { transform: none; transition: transform .9s cubic-bezier(.2, .7, .3, 1), --blue 1s, --red 1s; }
  #draft.Gone { visibility: hidden; }

  /* --- top strip: coaches and bans each side, the phase in the middle --- */
  .top { position: absolute; left: 0; top: 0; width: 100%; height: var(--top-h);
         background: linear-gradient(to bottom, rgba(5,8,26,0) 0%, rgba(5,8,26,.82) 30%, rgba(5,8,26,.94) 100%); }
  .side { position: absolute; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .side.blue { left: 16px; align-items: flex-start; }
  .side.red { right: 16px; align-items: flex-end; }
  .coach { font-size: 22px; letter-spacing: .04em; text-transform: uppercase; line-height: 22px; height: 22px;
           opacity: .9; white-space: nowrap; }
  .bans { display: flex; gap: 6px; }
  .side.red .bans { flex-direction: row-reverse; }
  .ban { position: relative; width: 52px; height: 52px; background: rgba(255,255,255,.06); overflow: hidden;
         border: 1px solid rgba(255,255,255,.12); }
  .ban img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.1); }
  .ban img[src=""] { display: none; }
  .ban.Done img { filter: saturate(.75) brightness(.85); }
  .ban.Done::after { content: ""; position: absolute; left: -10%; top: 50%; width: 120%; height: 2px;
                     background: rgba(255,255,255,.75); transform: rotate(-45deg); }
  .ban.Active { border-color: transparent; }
  .side.blue .ban.Active { box-shadow: inset 0 0 0 2px var(--blue), 0 0 14px var(--blue); animation: pulse 1.2s infinite; }
  .side.red .ban.Active { box-shadow: inset 0 0 0 2px var(--red), 0 0 14px var(--red); animation: pulse 1.2s infinite; }
  .ban.Active img { opacity: .55; }

  .phase { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .phase .name { font-size: 26px; letter-spacing: .08em; text-transform: uppercase; line-height: 28px; }
  .phase .secs { font-size: 34px; line-height: 40px; }

  /* --- the timer: a line that shrinks to the middle as time runs out --- */
  .timer { position: absolute; left: 0; top: var(--top-h); width: 100%; height: 4px; background: rgba(5,8,26,.94); }
  .timer .bar { position: absolute; left: 50%; top: 0; height: 100%; width: 0; transform: translateX(-50%);
                background: #fff; transition: width .25s linear, background-color .6s ease; }
  .timer .bar.blue { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
  .timer .bar.red { background: var(--red); box-shadow: 0 0 10px var(--red); }

  /* --- picks --- */
  .picks { position: absolute; top: calc(var(--top-h) + 4px); height: var(--picks-h); width: calc(5 * var(--card-w));
           display: flex; }
  .picks.blue { left: 0; background: linear-gradient(to right, var(--blue) 0%, color-mix(in srgb, var(--blue) 35%, var(--navy)) 35%, var(--navy) 85%); }
  .picks.red { right: 0; background: linear-gradient(to left, var(--red) 0%, color-mix(in srgb, var(--red) 35%, var(--navy)) 35%, var(--navy) 85%); }
  .card { position: relative; width: var(--card-w); height: 100%; overflow: hidden; border-left: 1px solid var(--line); }
  .picks.blue .card:first-child, .picks.red .card:last-child { border-left: none; }
  .card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%;
               opacity: 0; transform: scale(1.06); transition: opacity .5s ease, transform .8s ease, filter .5s ease; }
  .card.Picked .art { opacity: 1; transform: scale(1); }
  .card.Active .art { opacity: .45; filter: grayscale(.6) blur(1px); }
  .card .glow { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .picks.blue .card .glow { background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 45%),
                                        linear-gradient(to top, var(--blue) 0%, transparent 70%); }
  .picks.red .card .glow { background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 45%),
                                       linear-gradient(to top, var(--red) 0%, transparent 70%); }
  .card.Active .glow { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
                 background: linear-gradient(to top, rgba(5,8,26,.92), rgba(5,8,26,0)); }
  /* Names run up the card's left edge, from the bottom. */
  .card .names { position: absolute; left: 10px; bottom: 12px; display: flex; gap: 4px;
                 writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .card .player { font-size: 30px; line-height: 30px; letter-spacing: .03em; }
  .card .champ { font-size: 18px; line-height: 20px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  /* The role icon, cut out of the role placeholder pictures (icon at 115,157 83x83 of 308x560). */
  .card .role { position: absolute; left: 44px; bottom: 12px; width: 24px; height: 24px; opacity: .85;
                background-size: 89px 162px; background-position: -33px -45px; background-repeat: no-repeat; }
  .card .spells { position: absolute; right: 8px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .card .spells img { width: 26px; height: 26px; display: block; border: 1px solid rgba(255,255,255,.25); }

  /* --- the middle: series, logos, tri-codes --- */
  .mid { position: absolute; left: calc(50% - var(--mid-w) / 2); top: calc(var(--top-h) + 4px); width: var(--mid-w);
         height: var(--picks-h); background: var(--navy); overflow: hidden; isolation: isolate;
         border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .mid .bg { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 1s ease; }
  .mid .bg.On { opacity: 1; }
  .mid .bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mid .bg .tint { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .mid .bg::after { content: ""; position: absolute; inset: 0; background: rgba(5,8,26,.55); }
  .mid .pips { position: absolute; top: 18px; display: flex; gap: 5px; }
  .mid .pips.blue { left: 52px; } .mid .pips.red { right: 52px; flex-direction: row-reverse; }
  .mid .pip { width: 22px; height: 9px; border: 1.5px solid rgba(255,255,255,.85); }
  .mid .pip.Won { background: #fff; }
  .mid .teamlogo { position: absolute; top: 58px; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .mid .teamlogo.blue { left: 20px; } .mid .teamlogo.red { right: 20px; }
  .mid .teamlogo img, .mid .event img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 50% 50%; }
  .mid .event { position: absolute; left: 50%; top: 92px; width: 56px; height: 56px; transform: translateX(-50%);
                display: flex; align-items: center; justify-content: center; }
  .mid .tri { position: absolute; top: 186px; width: 120px; text-align: center; font-size: 64px; line-height: 64px; letter-spacing: .02em; }
  .mid .tri.blue { left: 20px; } .mid .tri.red { right: 20px; }
  .mid .score { position: absolute; left: 50%; top: 196px; transform: translateX(-50%); font-size: 40px; line-height: 44px; }
  .mid .game { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 22px;
               letter-spacing: .12em; text-transform: uppercase; opacity: .85; }

  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes breathe { 50% { opacity: .65; } }
</style>
<style id="fonts"></style>
</head>
<body>
<div id="draft" class="Gone">
  <div class="top">
    <div class="side blue"><div class="coach short" id="coach-blue"></div><div class="bans" id="bans-blue"></div></div>
    <div class="phase"><div class="name short" id="phase"></div><div class="secs kill" id="secs"></div></div>
    <div class="side red"><div class="coach short" id="coach-red"></div><div class="bans" id="bans-red"></div></div>
  </div>
  <div class="timer"><div class="bar" id="bar"></div></div>
  <div class="picks blue" id="picks-blue"></div>
  <div class="mid">
    <div class="bg" id="bg"><video muted loop autoplay playsinline></video><div class="tint"></div></div>
    <div class="pips blue" id="pips-blue"></div>
    <div class="pips red" id="pips-red"></div>
    <div class="teamlogo blue"><img id="logo-blue" alt=""></div>
    <div class="event"><img id="logo-event" alt=""></div>
    <div class="teamlogo red"><img id="logo-red" alt=""></div>
    <div class="tri blue short" id="tri-blue"></div>
    <div class="score kill" id="score"></div>
    <div class="tri red short" id="tri-red"></div>
    <div class="game short" id="game"></div>
  </div>
  <div class="picks red" id="picks-red"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROLES = ["top", "jung", "mid", "bot", "sup"].map(r => `draft/${r}_splash_placeholder.svg`);
const url = p => !p ? "" : /^https?:/.test(p) ? p : "/" + p.split("/").map(encodeURIComponent).join("/");
const LAYOUT = "lec";

if (params.get("fit") === "1") {
  const fit = () => {
    const k = Math.min(innerHeight / 1080, innerWidth / 1920);
    Object.assign(document.body.style, { transformOrigin: "0 0", transform: `translateX(${(innerWidth - 1920 * k) / 2}px) scale(${k})` });
  };
  addEventListener("resize", fit); fit();
}

function el(tag, cls, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.appendChild(n);
  return n;
}
function setSrc(img, src) { if (img.getAttribute("src") !== src) img.setAttribute("src", src); }
function nudge(img, a) {
  a = a || {};
  img.style.transform = `translate(${Number(a.x || 0)}px, ${Number(a.y || 0)}px) scale(${Number(a.scale ?? 1)})`;
}

// Cards and bans, built once (top to support, left to right, on both sides).
const sides = {};
for (const side of ["blue", "red"]) {
  const t = { cards: [], bans: [] };
  const picks = $(`picks-${side}`);
  for (let i = 0; i < 5; i++) {
    const card = el("div", "card", picks);
    const art = el("img", "art", card);
    el("div", "glow", card);
    el("div", "shade", card);
    const names = el("div", "names", card);
    const player = el("span", "player short", names);
    const champ = el("span", "champ short", names);
    const role = el("div", "role", card);
    role.style.backgroundImage = `url("${ROLES[i]}")`;
    const spells = el("div", "spells", card);
    const s1 = el("img", "", spells), s2 = el("img", "", spells);
    t.cards.push({ card, art, player, champ, role, spells, s1, s2 });
  }
  const bans = $(`bans-${side}`);
  for (let i = 0; i < 5; i++) {
    const ban = el("div", "ban", bans);
    t.bans.push({ ban, img: el("img", "", ban) });
  }
  sides[side] = t;
}

function lighten(c, amount) {
  if (!/^#[0-9a-f]{6}$/i.test(c || "")) return c;
  const n = parseInt(c.slice(1), 16);
  const ch = shift => Math.round(((n >> shift) & 255) + (255 - ((n >> shift) & 255)) * amount);
  return "#" + [16, 8, 0].map(sh => ch(sh).toString(16).padStart(2, "0")).join("");
}

let fontsKey = "";
function loadFonts(f) {
  const key = JSON.stringify(f || {});
  if (!f || key === fontsKey) return;
  fontsKey = key;
  $("fonts").textContent = (f.faces || []).map(x =>
    `@font-face { font-family: "${x.family}"; src: url("${x.src}"); ${x.weight ? `font-weight: ${x.weight};` : ""} ${x.style ? `font-style: ${x.style};` : ""} }`).join("\n");
  const root = document.documentElement.style;
  for (const [name, v] of [["kill", f.kill], ["short", f.short]]) {
    if (!v) continue;
    root.setProperty(`--${name}`, `"${v.family}"`);
    root.setProperty(`--${name}-weight`, v.weight || 400);
    root.setProperty(`--${name}-style`, v.italic ? "italic" : "normal");
  }
}

// The draft's background loop behind the middle, as the Europe look.
function renderBg(bg, blue, red) {
  const box = $("bg"), v = box.querySelector("video");
  const src = bg && bg.on && bg.video ? url(bg.video) : "";
  if (v.dataset.src !== src) {
    v.dataset.src = src;
    delete v.dataset.failed;
    if (src) { v.src = src; v.play().catch(() => {}); } else { v.removeAttribute("src"); v.load(); }
  }
  box.classList.toggle("On", !!src && !v.dataset.failed);
  if (!src) return;
  const rate = Math.min(4, Math.max(0.0625, Number(bg.speed) || 1));
  if (v.playbackRate !== rate) v.playbackRate = rate;
  const b = Math.min(3, Math.max(0, Number(bg.brightness ?? 1)));
  box.style.filter = b === 1 ? "" : `brightness(${b})`;
  v.style.filter = bg.tint ? "grayscale(1) brightness(1.6)" : "";
  const tint = box.querySelector(".tint");
  tint.style.display = bg.tint ? "" : "none";
  const l = lighten(blue, .35), r = lighten(red, .35);
  tint.style.background = `linear-gradient(to right, ${l} 0%, ${l} 30%, ${r} 70%, ${r} 100%)`;
}
$("bg").querySelector("video").addEventListener("error", e => { e.target.dataset.failed = "1"; $("bg").classList.remove("On"); });

function pips(side, bestOf, wins) {
  const box = $(`pips-${side}`), need = Math.max(1, Math.ceil((Number(bestOf) || 1) / 2));
  if (box.children.length !== need) { box.replaceChildren(); for (let i = 0; i < need; i++) el("div", "pip", box); }
  [...box.children].forEach((p, i) => p.classList.toggle("Won", i < wins));
}

function renderSide(side, team, info, show) {
  const t = sides[side];
  $(`coach-${side}`).textContent = show.coaches && info.coach ? info.coach : "";
  $(`tri-${side}`).textContent = info.tricode || "";
  const logo = $(`logo-${side}`);
  logo.style.display = info.logo ? "" : "none";
  if (info.logo) { setSrc(logo, url(info.logo)); nudge(logo, info.logo_adjust); }
  for (let i = 0; i < 5; i++) {
    const p = (team.picks || [])[i] || {}, v = t.cards[i];
    const champ = p.champion || {};
    const art = champ.loading || "";
    if (art) setSrc(v.art, art);
    v.card.classList.toggle("Picked", !!art && !p.active);
    v.card.classList.toggle("Active", !!p.active);
    v.player.textContent = p.name || "";
    v.champ.textContent = show.champ_names && champ.name && !p.active ? champ.name : "";
    const spells = show.spells && champ.name && !p.active && p.spell1 && p.spell2;
    v.spells.style.display = spells ? "" : "none";
    if (spells) { setSrc(v.s1, p.spell1); setSrc(v.s2, p.spell2); }
    const b = (team.bans || [])[i] || {}, bv = t.bans[i];
    setSrc(bv.img, (b.champion || {}).square || "");
    bv.ban.classList.toggle("Active", !!b.active);
    bv.ban.classList.toggle("Done", !!(b.champion || {}).square && !b.active);
  }
}

let shown = false, hideTimer = 0;
function open() {
  shown = true;
  clearTimeout(hideTimer);
  $("draft").classList.remove("Gone");
  requestAnimationFrame(() => requestAnimationFrame(() => $("draft").classList.add("On")));
}
function close() {
  shown = false;
  $("draft").classList.remove("On");
  hideTimer = setTimeout(() => $("draft").classList.add("Gone"), 950);
}

let timerTotal = 30;
function render(s) {
  if (s.layout && s.layout !== LAYOUT && !params.get("layout")) { location.reload(); return; }
  const d = s.draft || {};
  loadFonts(s.fonts);
  const blue = s.teams.blue.color || "#0a6d4c", red = s.teams.red.color || "#bd1313";
  const root = $("draft").style;
  root.setProperty("--blue", blue);
  root.setProperty("--red", red);
  renderBg(s.bg, blue, red);
  setSrc($("logo-event"), url(params.get("logo") || s.logo || "assets/logos/scc.png"));
  nudge($("logo-event"), s.logo_adjust);
  if (!d.active) { if (shown) close(); return; }
  if (!shown) open();

  $("phase").textContent = d.phase || "";
  const secs = Number(d.timer || 0);
  $("secs").textContent = d.phase ? secs : "";
  // The line: full at the start of each turn, gone at 0.
  if (d.timer_total) timerTotal = d.timer_total;
  else if (secs > timerTotal) timerTotal = secs;
  const bar = $("bar");
  bar.style.width = (d.phase ? Math.min(1, secs / (timerTotal || 30)) * 100 : 0) + "%";
  bar.classList.toggle("blue", !!d.blue.active);
  bar.classList.toggle("red", !!d.red.active);

  const show = s.show || {};
  renderSide("blue", d.blue, s.teams.blue, show);
  renderSide("red", d.red, s.teams.red, show);
  const wb = Number(s.teams.blue.score || 0), wr = Number(s.teams.red.score || 0);
  pips("blue", s.best_of, wb);
  pips("red", s.best_of, wr);
  $("pips-blue").style.display = $("pips-red").style.display = show.score ? "" : "none";
  $("score").textContent = show.score ? `${wb}-${wr}` : "";
  const bo = Number(s.best_of) || 1;
  $("game").textContent = bo > 1 ? `Game ${Math.min(bo, wb + wr + 1)} · Best of ${bo}` : "Best of 1";
}

async function poll() {
  try { render(await (await fetch("/api/draft", { cache: "no-store" })).json()); } catch (e) { /* app restarting */ }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
