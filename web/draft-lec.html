<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft (LEC)</title>
<!-- Champ select overlay (OBS / vMix browser source, 1920x1080) in the look
     of the LEC broadcast: boxes with the coaches and bans each side and the
     phase in the middle, a timer line, ten pick cards and the match in the
     middle. Driven by the app's /api/draft, like the Europe look. -->
<style>
  @font-face { font-family: "Saira Condensed"; src: url("draft/saira-condensed.woff2") format("woff2"); font-weight: 100 900; }
  @property --blue { syntax: "<color>"; inherits: true; initial-value: #0a6d4c; }
  @property --red { syntax: "<color>"; inherits: true; initial-value: #bd1313; }
  :root {
    --navy: #060a24; --box: rgba(10, 12, 40, .86);
    --short: "Heathergreen"; --short-weight: 400; --short-style: normal;
    --kill: "Inter"; --kill-weight: 700; --kill-style: normal;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  .short { font-family: var(--short), "Saira Condensed", sans-serif; font-weight: var(--short-weight); font-style: var(--short-style); }
  .kill { font-family: var(--kill), "Saira Condensed", sans-serif; font-weight: var(--kill-weight); font-style: var(--kill-style);
          font-variant-numeric: tabular-nums; }

  /* Everything sits in the bottom 360px: header boxes 720-820, the timer
     line 820-828, the cards 828-1080. It slides up when champ select starts
     and back down when it ends. */
  #draft { position: absolute; left: 0; top: 720px; width: 1920px; height: 360px; color: #fff;
           --blue-hi: color-mix(in srgb, var(--blue) 70%, white); --red-hi: color-mix(in srgb, var(--red) 70%, white);
           transform: translateY(105%); transition: transform .9s cubic-bezier(.55, 0, .75, .3), --blue 1s, --red 1s; }
  #draft.On { transform: none; transition: transform .9s cubic-bezier(.2, .7, .3, 1), --blue 1s, --red 1s; }
  #draft.Gone { visibility: hidden; }

  /* --- header boxes --- */
  .box { position: absolute; top: 0; height: 100px; background: var(--box); }
  .coaches { left: 0; width: 318px; }
  .coaches.red { left: auto; right: 0; }
  .coach { position: absolute; left: 0; right: 0; top: 7px; text-align: center; font-size: 22px; line-height: 26px;
           text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  .bans { position: absolute; top: 37px; display: flex; gap: 2px; }
  .coaches.blue .bans { left: 2px; }
  .coaches.red .bans { right: 2px; flex-direction: row-reverse; }
  .ban { position: relative; width: 62px; height: 62px; overflow: hidden; }
  .ban img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.08); }
  .ban img[src=""] { display: none; }
  /* Each slot is struck through, empty or banned. */
  .ban::after { content: ""; position: absolute; left: 50%; top: 50%; width: 52px; height: 1.5px; background: rgba(255,255,255,.9);
                transform: translate(-50%, -50%) rotate(45deg); }
  .ban.Done::after { width: 60px; background: rgba(255,255,255,.8); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  .coaches.blue .ban.Active { background: linear-gradient(135deg, var(--blue-hi), var(--blue)); }
  .coaches.red .ban.Active { background: linear-gradient(135deg, var(--red-hi), var(--red)); }
  .ban.Active img { opacity: .5; }

  .phasebox { left: 687px; width: 546px; text-align: center; }
  .phase { margin-top: 7px; font-size: 26px; line-height: 28px; letter-spacing: .04em; text-transform: uppercase; }
  .secs { font-size: 46px; line-height: 56px; }

  /* --- the timer line: shrinks to the middle as the turn runs out --- */
  .timer { position: absolute; left: 0; top: 100px; width: 100%; height: 8px; }
  .timer .bar { position: absolute; left: 50%; top: 0; height: 100%; width: 0; transform: translateX(-50%);
                transition: width .25s linear, background-color .6s ease; background: #fff; }
  .timer .bar.blue { background: var(--blue-hi); }
  .timer .bar.red { background: var(--red-hi); }

  /* --- pick cards --- */
  .picks { position: absolute; top: 108px; height: 252px; width: 800px; display: flex; }
  .picks.blue { left: 0; background: linear-gradient(to right, var(--blue) 0%, color-mix(in srgb, var(--blue) 30%, var(--navy)) 40%, var(--navy) 75%); }
  .picks.red { right: 0; background: linear-gradient(to left, var(--red) 0%, color-mix(in srgb, var(--red) 30%, var(--navy)) 40%, var(--navy) 75%); }
  .card { position: relative; width: 160px; height: 100%; overflow: hidden; }
  /* Team colour lines between the cards (and by the middle). */
  .picks.blue .card { border-right: 2px solid var(--blue-hi); }
  .picks.red .card { border-left: 2px solid var(--red-hi); }
  .card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%;
               opacity: 0; transform: scale(1.08); transition: opacity .5s ease, transform .9s ease; }
  .card.Picked .art { opacity: 1; transform: scale(1); }
  /* Picking: the card lights up in the team colour around a dark hole. */
  .card .hole { position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease; }
  .picks.blue .card .hole { background: radial-gradient(ellipse 34% 30% at 50% 45%, var(--navy) 0%, rgba(6,10,36,.85) 45%, rgba(6,10,36,0) 100%),
                                        linear-gradient(160deg, var(--blue-hi) 0%, var(--blue) 70%); }
  .picks.red .card .hole { background: radial-gradient(ellipse 34% 30% at 50% 45%, var(--navy) 0%, rgba(6,10,36,.85) 45%, rgba(6,10,36,0) 100%),
                                       linear-gradient(200deg, var(--red-hi) 0%, var(--red) 70%); }
  .card.Active .hole { opacity: 1; }
  .card.Active .art { opacity: 0; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; opacity: 0; transition: opacity .5s;
                 background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .card.Picked .shade { opacity: 1; }
  /* Names run up the card's outer edge from the bottom (the player, then
     the champion), the role icon beside. */
  .card .names { position: absolute; bottom: 20px; display: flex; align-items: baseline; gap: 10px; writing-mode: vertical-rl; transform: rotate(180deg);
                 white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-height: 220px; overflow: hidden; }
  .picks.blue .card .names { left: 12px; }
  .picks.red .card .names { right: 12px; }
  .card .player { font-size: 34px; line-height: 32px; }
  .card .champ { font-size: 18px; line-height: 20px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  /* (the role icon is cut out of the role placeholder pictures: 83x83 at 115,157 of 308x560) */
  .card .role { position: absolute; bottom: 22px; width: 24px; height: 24px;
                background-size: 89px 162px; background-position: -33px -45px; background-repeat: no-repeat; }
  .picks.blue .card .role { left: 62px; }
  .picks.red .card .role { right: 62px; }
  .card .spells { position: absolute; top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .picks.blue .card .spells { right: 10px; } .picks.red .card .spells { left: 10px; }
  .card .spells img { width: 26px; height: 26px; display: block; border: 1px solid rgba(255,255,255,.3); }

  /* --- the middle --- */
  .mid { position: absolute; left: 800px; top: 108px; width: 320px; height: 252px; background: var(--navy); overflow: hidden; isolation: isolate; }
  .mid .glow { position: absolute; inset: 0; z-index: -1; transition: opacity .8s ease; opacity: 0; }
  .mid .glow.blue { background: radial-gradient(ellipse 80% 70% at 0% 100%, color-mix(in srgb, var(--blue) 75%, transparent), transparent 70%); }
  .mid .glow.red { background: radial-gradient(ellipse 80% 70% at 100% 100%, color-mix(in srgb, var(--red) 75%, transparent), transparent 70%); }
  .mid .glow.On { opacity: 1; }
  .mid .bg { position: absolute; inset: 0; z-index: -2; opacity: 0; transition: opacity 1s ease; }
  .mid .bg.On { opacity: .55; }
  .mid .bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mid .bg .tint { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .mid .col { position: absolute; top: 0; width: 160px; height: 100%; }
  .mid .col.blue { left: 0; } .mid .col.red { right: 0; }
  .mid .pips { position: absolute; top: 19px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .mid .pip { width: 26px; height: 14px; border: 2px solid #fff; }
  .mid .pip.Won { background: #fff; }
  .mid .label { position: absolute; top: 49px; left: 0; right: 0; text-align: center; font-size: 15px; line-height: 18px;
                letter-spacing: .02em; text-transform: uppercase; }
  .mid .teamlogo { position: absolute; top: 83px; left: 50%; width: 84px; height: 80px; transform: translateX(-50%);
                   display: flex; align-items: center; justify-content: center; }
  .mid .teamlogo img, .mid .event img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 50% 50%; }
  .mid .tri { position: absolute; top: 166px; left: 0; right: 0; text-align: center; font-size: 54px; line-height: 54px; }
  .mid .arrow { position: absolute; top: 50px; left: 50%; width: 0; height: 0; transform: translateX(-50%);
                border-top: 7px solid transparent; border-bottom: 7px solid transparent; opacity: 0; transition: opacity .4s; }
  .mid .arrow.blue { border-right: 12px solid #fff; opacity: 1; }
  .mid .arrow.red { border-left: 12px solid #fff; opacity: 1; }
  .mid .event { position: absolute; left: 50%; top: 90px; width: 52px; height: 66px; transform: translateX(-50%);
                display: flex; align-items: center; justify-content: center; }
  .mid .patch { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 19px; line-height: 22px;
                text-transform: uppercase; }
</style>
<style id="fonts"></style>
</head>
<body>
<div id="draft" class="Gone">
  <div class="box coaches blue"><div class="coach kill" id="coach-blue"></div><div class="bans" id="bans-blue"></div></div>
  <div class="box phasebox"><div class="phase short" id="phase"></div><div class="secs kill" id="secs"></div></div>
  <div class="box coaches red"><div class="coach kill" id="coach-red"></div><div class="bans" id="bans-red"></div></div>
  <div class="timer"><div class="bar" id="bar"></div></div>
  <div class="picks blue" id="picks-blue"></div>
  <div class="mid">
    <div class="bg" id="bg"><video muted loop autoplay playsinline></video><div class="tint"></div></div>
    <div class="glow blue" id="glow-blue"></div>
    <div class="glow red" id="glow-red"></div>
    <div class="col blue">
      <div class="pips" id="pips-blue"></div>
      <div class="label kill">Blue side</div>
      <div class="teamlogo"><img id="logo-blue" alt=""></div>
      <div class="tri short" id="tri-blue"></div>
    </div>
    <div class="arrow" id="arrow"></div>
    <div class="event"><img id="logo-event" alt=""></div>
    <div class="col red">
      <div class="pips" id="pips-red"></div>
      <div class="label kill">Red side</div>
      <div class="teamlogo"><img id="logo-red" alt=""></div>
      <div class="tri short" id="tri-red"></div>
    </div>
    <div class="patch kill" id="patch"></div>
  </div>
  <div class="picks red" id="picks-red"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROLES = ["top", "jung", "mid", "bot", "sup"].map(r => `draft/${r}_splash_placeholder.svg`);
const url = p => !p ? "" : /^https?:/.test(p) ? p : "/" + p.split("/").map(encodeURIComponent).join("/");
const LAYOUT = "lec";

if (params.get("fit") === "1") {
  const fit = () => {
    const k = Math.min(innerHeight / 1080, innerWidth / 1920);
    Object.assign(document.body.style, { transformOrigin: "0 0", transform: `translateX(${(innerWidth - 1920 * k) / 2}px) scale(${k})` });
  };
  addEventListener("resize", fit); fit();
}

function el(tag, cls, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (parent) parent.appendChild(n);
  return n;
}
function setSrc(img, src) { if (img.getAttribute("src") !== src) img.setAttribute("src", src); }
function nudge(img, a) {
  a = a || {};
  img.style.transform = `translate(${Number(a.x || 0)}px, ${Number(a.y || 0)}px) scale(${Number(a.scale ?? 1)})`;
}

// Cards and bans, built once: top to support, left to right, on both sides;
// bans from the outside in.
const sides = {};
for (const side of ["blue", "red"]) {
  const t = { cards: [], bans: [] };
  const picks = $(`picks-${side}`);
  for (let i = 0; i < 5; i++) {
    const card = el("div", "card", picks);
    const art = el("img", "art", card);
    el("div", "hole", card);
    el("div", "shade", card);
    const names = el("div", "names", card);
    const player = el("span", "player short", names);
    const champ = el("span", "champ short", names);
    const role = el("div", "role", card);
    role.style.backgroundImage = `url("${ROLES[i]}")`;
    const spells = el("div", "spells", card);
    const s1 = el("img", "", spells), s2 = el("img", "", spells);
    t.cards.push({ card, art, player, champ, spells, s1, s2 });
  }
  const bans = $(`bans-${side}`);
  for (let i = 0; i < 5; i++) {
    const ban = el("div", "ban", bans);
    t.bans.push({ ban, img: el("img", "", ban) });
  }
  sides[side] = t;
}

function lighten(c, amount) {
  if (!/^#[0-9a-f]{6}$/i.test(c || "")) return c;
  const n = parseInt(c.slice(1), 16);
  const ch = shift => Math.round(((n >> shift) & 255) + (255 - ((n >> shift) & 255)) * amount);
  return "#" + [16, 8, 0].map(sh => ch(sh).toString(16).padStart(2, "0")).join("");
}

let fontsKey = "";
function loadFonts(f) {
  const key = JSON.stringify(f || {});
  if (!f || key === fontsKey) return;
  fontsKey = key;
  $("fonts").textContent = (f.faces || []).map(x =>
    `@font-face { font-family: "${x.family}"; src: url("${x.src}"); ${x.weight ? `font-weight: ${x.weight};` : ""} ${x.style ? `font-style: ${x.style};` : ""} }`).join("\n");
  const root = document.documentElement.style;
  for (const [name, v] of [["kill", f.kill], ["short", f.short]]) {
    if (!v) continue;
    root.setProperty(`--${name}`, `"${v.family}"`);
    root.setProperty(`--${name}-weight`, v.weight || 400);
    root.setProperty(`--${name}-style`, v.italic ? "italic" : "normal");
  }
}

// The draft's background loop behind the middle, as in the Europe look.
function renderBg(bg, blue, red) {
  const box = $("bg"), v = box.querySelector("video");
  const src = bg && bg.on && bg.video ? url(bg.video) : "";
  if (v.dataset.src !== src) {
    v.dataset.src = src;
    delete v.dataset.failed;
    if (src) { v.src = src; v.play().catch(() => {}); } else { v.removeAttribute("src"); v.load(); }
  }
  box.classList.toggle("On", !!src && !v.dataset.failed);
  if (!src) return;
  const rate = Math.min(4, Math.max(0.0625, Number(bg.speed) || 1));
  if (v.playbackRate !== rate) v.playbackRate = rate;
  const b = Math.min(3, Math.max(0, Number(bg.brightness ?? 1)));
  box.style.filter = b === 1 ? "" : `brightness(${b})`;
  v.style.filter = bg.tint ? "grayscale(1) brightness(1.6)" : "";
  const tint = box.querySelector(".tint");
  tint.style.display = bg.tint ? "" : "none";
  const l = lighten(blue, .35), r = lighten(red, .35);
  tint.style.background = `linear-gradient(to right, ${l} 0%, ${l} 30%, ${r} 70%, ${r} 100%)`;
}
$("bg").querySelector("video").addEventListener("error", e => { e.target.dataset.failed = "1"; $("bg").classList.remove("On"); });

function pips(side, bestOf, wins) {
  const box = $(`pips-${side}`), need = Math.max(1, Math.ceil((Number(bestOf) || 1) / 2));
  if (box.children.length !== need) { box.replaceChildren(); for (let i = 0; i < need; i++) el("div", "pip", box); }
  [...box.children].forEach((p, i) => p.classList.toggle("Won", i < wins));
}

function renderSide(side, team, info, show) {
  const t = sides[side];
  $(`coach-${side}`).textContent = show.coaches && info.coach ? info.coach : "";
  $(`tri-${side}`).textContent = info.tricode || "";
  const logo = $(`logo-${side}`);
  logo.style.display = info.logo ? "" : "none";
  if (info.logo) { setSrc(logo, url(info.logo)); nudge(logo, info.logo_adjust); }
  for (let i = 0; i < 5; i++) {
    const p = (team.picks || [])[i] || {}, v = t.cards[i];
    const champ = p.champion || {};
    if (champ.loading) setSrc(v.art, champ.loading);
    v.card.classList.toggle("Picked", !!champ.loading && !p.active);
    v.card.classList.toggle("Active", !!p.active);
    v.player.textContent = p.name || "";
    v.champ.textContent = show.champ_names && champ.name && !p.active ? champ.name : "";
    v.champ.style.display = v.champ.textContent ? "" : "none";
    const spells = show.spells && champ.name && !p.active && p.spell1 && p.spell2;
    v.spells.style.display = spells ? "" : "none";
    if (spells) { setSrc(v.s1, p.spell1); setSrc(v.s2, p.spell2); }
    const b = (team.bans || [])[i] || {}, bv = t.bans[i];
    setSrc(bv.img, (b.champion || {}).square || "");
    bv.ban.classList.toggle("Active", !!b.active);
    bv.ban.classList.toggle("Done", !!(b.champion || {}).square && !b.active);
  }
}

let shown = false, hideTimer = 0;
function open() {
  shown = true;
  clearTimeout(hideTimer);
  $("draft").classList.remove("Gone");
  requestAnimationFrame(() => requestAnimationFrame(() => $("draft").classList.add("On")));
}
function close() {
  shown = false;
  $("draft").classList.remove("On");
  hideTimer = setTimeout(() => $("draft").classList.add("Gone"), 950);
}

let timerTotal = 30;
function render(s) {
  if (s.layout && s.layout !== LAYOUT && !params.get("layout")) { location.reload(); return; }
  const d = s.draft || {};
  loadFonts(s.fonts);
  const blue = s.teams.blue.color || "#0a6d4c", red = s.teams.red.color || "#bd1313";
  const root = $("draft").style;
  root.setProperty("--blue", blue);
  root.setProperty("--red", red);
  renderBg(s.bg, blue, red);
  setSrc($("logo-event"), url(params.get("logo") || s.logo || "assets/logos/scc.png"));
  nudge($("logo-event"), s.logo_adjust);
  if (!d.active) { if (shown) close(); return; }
  if (!shown) open();

  $("phase").textContent = d.phase || "";
  const secs = Number(d.timer || 0);
  $("secs").textContent = d.phase ? secs : "";
  // The line: full at the start of each turn, gone at 0, in the acting team's colour.
  if (d.timer_total) timerTotal = d.timer_total;
  else if (secs > timerTotal) timerTotal = secs;
  const bar = $("bar");
  bar.style.width = (d.phase ? Math.min(1, secs / (timerTotal || 30)) * 100 : 0) + "%";
  for (const side of ["blue", "red"]) {
    bar.classList.toggle(side, !!d[side].active);
    $(`glow-${side}`).classList.toggle("On", !!d[side].active);
  }
  $("arrow").className = "arrow " + (d.blue.active ? "blue" : d.red.active ? "red" : "");

  const show = s.show || {};
  renderSide("blue", d.blue, s.teams.blue, show);
  renderSide("red", d.red, s.teams.red, show);
  pips("blue", s.best_of, Number(s.teams.blue.score || 0));
  pips("red", s.best_of, Number(s.teams.red.score || 0));
  $("pips-blue").style.display = $("pips-red").style.display = show.score ? "" : "none";
  $("patch").textContent = s.patch ? `Patch ${s.patch}` : "";
}

async function poll() {
  try { render(await (await fetch("/api/draft", { cache: "no-store" })).json()); } catch (e) { /* app restarting */ }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
