# Builds the League HUD desktop app (LeagueHUD.exe) on Windows and publishes
# it as a GitHub release (v1.0.<run number>) with LeagueHUD-windows.zip.
# The app checks the latest release on launch and offers to update itself.
#
# Every run also leaves the zip on the run's summary page (Actions tab).
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read gold from a real spectator screenshot (Windows text recognition)
        # Top 60px of a 1920x1080 frame that showed 8.0k / 8.9k.
        run: python -m lolhud.ocr tests/fixtures/spectator_topbar.png 8000 8900 1079

      - name: Stamp the version
        shell: pwsh
        run: |
          Set-Content lolhud/version.py "VERSION = `"$env:VERSION`"" -Encoding utf8
          Get-Content lolhud/version.py

      - name: Build LeagueHUD.exe
        run: pyinstaller --noconfirm LeagueHUD.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $app = "dist\LeagueHUD"
          $p = Start-Process "$app\LeagueHUD.exe" -ArgumentList '--smoke-test', '--port', '8799' -PassThru -Wait
          Get-Content "$app\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          # Leave no test leftovers in the download.
          Remove-Item "$app\smoke-test.txt", "$app\config.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\output", "$app\_update" -Recurse -ErrorAction SilentlyContinue

      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist\LeagueHUD\

      - uses: actions/upload-artifact@v4
        with:
          name: LeagueHUD-windows
          path: dist/LeagueHUD

      - name: Publish release
        shell: pwsh
        run: |
          Compress-Archive -Path dist\LeagueHUD\* -DestinationPath LeagueHUD-windows.zip
          $notes = git log -1 --format=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = ($notes -join "`n").Trim()
          gh release create "$env:VERSION" LeagueHUD-windows.zip --target "${{ github.sha }}" --title "League HUD $env:VERSION" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
