# Builds the League HUD desktop app (LeagueHUD.exe) on Windows and publishes
# it as a GitHub release (v1.0.<run number>, or the next free one) with LeagueHUD-windows.zip.
# The app checks the latest release on launch and offers to update itself.
# Each release also gets SCC-LoL-HUD-Setup.exe, an installer that downloads
# the latest release from GitHub when it runs.
#
# A commit with [no release] in its message builds and tests without publishing.
#
# Every run also leaves the zip on the run's summary page (Actions tab).
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        # v1.0.<run number>, moved past any release already published by hand
        # with that number.
        shell: pwsh
        run: |
          $tags = git ls-remote --tags origin | ForEach-Object { ($_ -split 'refs/tags/')[1] }
          $n = ${{ github.run_number }}
          while ($tags -contains "v1.0.$n") { $n++ }
          "VERSION=v1.0.$n" >> $env:GITHUB_ENV
          Write-Host "Version v1.0.$n"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read the top bar from real spectator screenshots (Windows text recognition)
        # Top 60px of a 1920x1080 frame: 8.0k / 8.9k gold, all objectives 0;
        # then the same frame with red on 3 grubs. --counts is dragons,heralds,grubs,towers.
        run: |
          python -m lolhud.ocr tests/fixtures/spectator_topbar.png --height 1079 --gold 8000 8900 --counts 0,0,0,0 0,0,0,0
          if ($LASTEXITCODE) { exit 1 }
          python -m lolhud.ocr tests/fixtures/spectator_topbar_grubs3.png --height 1079 --gold 8000 8900 --counts 0,0,0,0 0,0,3,0
          if ($LASTEXITCODE) { exit 1 }
          # Objective bounties showing: red's counters move up 9px with bounty text below.
          python -m lolhud.ocr tests/fixtures/spectator_topbar_bounties.png --height 1079 --gold 8000 8900 --counts 0,0,0,0 0,0,3,0
          if ($LASTEXITCODE) { exit 1 }

      - name: Import the SCC PSD as a HUD profile
        run: |
          python -m lolhud.psd_import design/lol-hud-SCC27.psd "CI import"
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item profiles -Recurse -ErrorAction SilentlyContinue

      - name: Stamp the version
        shell: pwsh
        run: |
          Set-Content lolhud/version.py "VERSION = `"$env:VERSION`"" -Encoding utf8
          Get-Content lolhud/version.py

      - name: Build LeagueHUD.exe
        run: pyinstaller --noconfirm LeagueHUD.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $app = "dist\LeagueHUD"
          $p = Start-Process "$app\LeagueHUD.exe" -ArgumentList '--smoke-test', '--port', '8799' -PassThru -Wait
          Get-Content "$app\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          # Leave no test leftovers in the download.
          Remove-Item "$app\smoke-test.txt", "$app\config.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\output", "$app\_update", "$app\certs" -Recurse -ErrorAction SilentlyContinue

      - name: Check the HUD-on-game window (see-through and click-through)
        # Puts a red window on screen with the HUD window over it, then checks
        # the red shows through, the HUD is drawn and clicks pass through.
        # Run in Windows' light and dark mode (dark mode adds a backdrop).
        timeout-minutes: 8
        shell: pwsh
        run: |
          $app = "dist\LeagueHUD"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item $key -Force | Out-Null
          New-Item overlay-test -ItemType Directory -Force | Out-Null
          $failed = @()
          foreach ($theme in @(@{ name = "light"; v = 1 }, @{ name = "dark"; v = 0 })) {
            Set-ItemProperty $key AppsUseLightTheme $theme.v -Type DWord
            Set-ItemProperty $key SystemUsesLightTheme $theme.v -Type DWord
            $p = Start-Process "$app\LeagueHUD.exe" -ArgumentList '--overlay-test', '--demo', '--port', '8798' -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "Timed out" }
            Get-ChildItem "$app\overlay-test*" | ForEach-Object { Move-Item $_.FullName "overlay-test\$($theme.name)-$($_.Name)" -Force }
            Write-Host "--- $($theme.name) mode"
            Get-Content "overlay-test\$($theme.name)-overlay-test.txt" -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { $failed += $theme.name }
          }
          Set-ItemProperty $key AppsUseLightTheme 1 -Type DWord
          Remove-Item "$app\config.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\output", "$app\_update", "$app\certs" -Recurse -ErrorAction SilentlyContinue
          if ($failed) { throw "HUD window check failed in $($failed -join ', ') mode" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-test
          path: overlay-test

      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist\LeagueHUD\

      - uses: actions/upload-artifact@v4
        with:
          name: LeagueHUD-windows
          path: dist/LeagueHUD

      - name: Build PlayerCam.exe (the players' webcam app)
        run: pyinstaller --noconfirm PlayerCam.spec

      - name: Smoke test the Player Cam app
        shell: pwsh
        run: |
          $app = "dist\PlayerCam"
          $p = Start-Process "$app\PlayerCam.exe" -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content "$app\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "Player Cam smoke test failed (exit code $($p.ExitCode))" }
          Remove-Item "$app\smoke-test.txt" -ErrorAction SilentlyContinue

      - name: Build the installer
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\SCC-LoL-HUD.iss
          if ($LASTEXITCODE) { exit 1 }
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\SCC-Player-Cam.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Publish release
        if: "!contains(github.event.head_commit.message, '[no release]')"
        # The app zip and the installer go up together, so the latest release
        # always has both (the installer link never 404s mid-build).
        shell: pwsh
        run: |
          # Never ship a test run's settings or https certificate (it has a private key).
          foreach ($f in "config.json", "certs", "webview") {
            if ((Test-Path "dist\LeagueHUD\$f") -or (Test-Path "dist\PlayerCam\$f")) { throw "Test leftover in the app: $f" }
          }
          Compress-Archive -Path dist\LeagueHUD\* -DestinationPath LeagueHUD-windows.zip
          Compress-Archive -Path dist\PlayerCam\* -DestinationPath PlayerCam-windows.zip
          $notes = git log -1 --format=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = ($notes -join "`n").Trim()
          gh release create "$env:VERSION" LeagueHUD-windows.zip dist\SCC-LoL-HUD-Setup.exe PlayerCam-windows.zip dist\SCC-Player-Cam-Setup.exe --target "${{ github.sha }}" --title "League HUD $env:VERSION" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test the installers (silent; they install the release just published)
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          foreach ($t in @(@{ setup = "SCC-LoL-HUD-Setup.exe"; exe = "LeagueHUD.exe" }, @{ setup = "SCC-Player-Cam-Setup.exe"; exe = "PlayerCam.exe" })) {
            $dir = "$env:RUNNER_TEMP\$($t.exe) test"
            $installArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/MERGETASKS="!desktopicon"', '/LOG=install.log'
            $p = Start-Process "dist\$($t.setup)" -ArgumentList $installArgs -PassThru -Wait
            Get-Content install.log -Tail 25
            if ($p.ExitCode -ne 0) { throw "$($t.setup) failed (exit code $($p.ExitCode))" }
            if (-not (Test-Path "$dir\$($t.exe)")) { throw "$($t.exe) wasn't installed" }
            if (-not (Test-Path "$dir\_internal")) { throw "_internal wasn't installed" }
            Write-Host "$($t.setup) installed OK to $dir"
          }
